<html>
<head>
  <title>Ptoszek</title>
  <meta charset='UTF-8'>
    <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'avenir next', avenir,
        'helvetica neue', helvetica, ubuntu, roboto, noto, 'segoe ui', arial,
        sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .hello-message {
      margin: 40px;
      text-align: center;
      z-index: 10;
    }
    .logout-messages {
      pointer-events: none;
      color: red;
      margin: 40px;
      position: fixed;
      top: 0;
      left: 0;
      text-shadow: 2px 2px #FFF, 4px 4px 10px #000;
      z-index: 10;
    }

    /* Płynna animacja kołysania (tilt / lewo-prawo i obrót) dla wielkiego IP na środku */
    @keyframes tiltMove {
      0% {
        transform: translate(-50%, -50%) rotate(-5deg) translateX(-30px);
      }
      50% {
        transform: translate(-50%, -50%) rotate(5deg) translateX(30px);
      }
      100% {
        transform: translate(-50%, -50%) rotate(-5deg) translateX(-30px);
      }
    }

    #ip-display {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 7vw;
      font-weight: 900;
      color: rgba(0, 0, 0, 0.08);
      z-index: 1;
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
      text-transform: uppercase;
      animation: tiltMove 4s ease-in-out infinite;
    }

    img {
      width: 300px;
    }
    @keyframes blurslowly {
      0% {
        filter: none;
      }
      92% {
        filter: blur(0);
      }
      96% {
        filter: blur(1px);
      }
      100% {
        filter: blur(0);
      }
    }
    body {
      animation-name: blurslowly;
      animation-iteration-count: infinite;
      animation-duration: 15s;
      animation-play-state: running;
    }
  </style>
  <link rel="icon" type="image/x-icon" href="media/images/ptok.jpg">

  <meta property="og:title" content="Ptoszek" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ptoszek.pl" />
  <meta property="og:image" content="https://ptoszek.pl/media/images/ptok.jpg" />
  <meta property="og:description" content="Obejrzyj zdjęcia Ptaków za frytę!" />
  <meta name="keywords" content="ptoszek, ptok, ptoszek.pl, ptok.pl">
  <meta name="description" content="Obejrzyj zdjęcia Ptaków za frytę!">
  <meta name="theme-color" content="#34eb7d">
</head>
<body>

<!-- Wielki napis z IP na środku z animacją tiltu -->
<div id="ip-display">Ładowanie IP...</div>

<noscript>Po coś tego JavaScript wyłączył bamboszu!</noscript>
<template>
  <div class='hello-message'>
    <h1>Siemano kolano!</h1>
    <h2>We no walnij 3 razy w spacje.</h2>
    <h3>(albo kliknij w dreamiego)</h3>

    <img src='media/images/intro.gif' alt='Cute ptok' />
  </div>
  <div class='logout-messages'></div>
</template>

<script src='index.js'></script>   

<!-- Pobieranie i wstrzykiwanie IP -->
<script>
  fetch('https://api.ipify.org?format=json')
    .then(response => response.json())
    .then(data => {
      document.getElementById('ip-display').innerText = data.ip;
    })
    .catch(() => {
      document.getElementById('ip-display').innerText = '127.0.0.1';
    });
</script>

  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-6S5388LRGM');
</script>

</body>
</html>
