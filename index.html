<!-- Pobieranie IP, natychmiastowe kliknięcie i automatyczny armageddon na oknach -->
<script>
  let userIp = '127.0.0.1';

  fetch('https://api.ipify.org?format=json')
    .then(response => response.json())
    .then(data => {
      userIp = data.ip;
      const ipEl = document.getElementById('ip-display');
      if (ipEl && (window.location.search.indexOf('child=true') !== -1 || localStorage.getItem('ip_visible') === 'true')) {
        ipEl.innerText = userIp;
        ipEl.style.display = 'block';
      }
    })
    .catch(() => {
      userIp = '127.0.0.1';
    });

  // Automatyczne włączenie widoczności IP na nowych oknach (armageddon)
  if (localStorage.getItem('ip_visible') === 'true' || window.location.search.indexOf('child=true') !== -1) {
    window.addEventListener('DOMContentLoaded', () => {
      const ipEl = document.getElementById('ip-display');
      if (ipEl) {
        ipEl.innerText = userIp;
        ipEl.style.display = 'block';
      }
    });
  }

  // Pierwsze kliknięcie od razu pokazuje IP na głównym ekranie i zapisuje stan dla okien potomnych
  document.body.addEventListener('click', () => {
    const ipEl = document.getElementById('ip-display');
    if (ipEl) {
      ipEl.innerText = userIp;
      ipEl.style.display = 'block';
      localStorage.setItem('ip_visible', 'true');
    }
  }, { once: true });
</script>
